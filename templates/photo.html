<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #05070d; --panel: rgba(14, 18, 30, .86); --line: rgba(160, 180, 220, .16);
    --text: #e6ebf5; --muted: #8c97ad; --accent: #7cc4ff; --gold: #ffcf6e; --dso: #b79cff;
    --inv: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap; z-index: 5; background: #070a12; }
  header .back { color: var(--muted); font-size: 13px; white-space: nowrap; }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .controls { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .controls label { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; user-select: none; }
  .controls input[type=range] { width: 110px; accent-color: var(--accent); }
  .controls input[type=checkbox] { accent-color: var(--accent); }
  .btn { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 9px; font: inherit; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.12); }

  main { flex: 1; position: relative; overflow: hidden; display: flex; }
  #viewport { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
  #viewport.dragging { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #stage img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  #layer { position: absolute; inset: 0; }
  body.hide-markers #layer { display: none; }

  .mk { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer;
    width: calc(var(--s) * 1px * var(--inv)); height: calc(var(--s) * 1px * var(--inv));
    border: calc(1.3px * var(--inv)) solid rgba(124, 196, 255, .55); }
  .mk::after { content: ""; position: absolute; inset: calc(-6px * var(--inv)); border-radius: 50%; } /* bigger hit area */
  .mk.dso { border-color: rgba(183, 156, 255, .85); border-style: dashed; }
  .mk.wiki { border-color: rgba(124, 196, 255, .95); }
  .mk.main { border: calc(2px * var(--inv)) solid var(--gold); box-shadow: 0 0 calc(10px * var(--inv)) rgba(255,207,110,.5); }
  .mk:hover, .mk.active { border-color: #fff; border-style: solid; z-index: 3; }
  .mk.faint { display: none; }

  .ell { position: absolute; border: calc(1.3px * var(--inv)) dashed rgba(183, 156, 255, .6);
    border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) rotate(var(--a)); }
  .ell.active { border-color: #fff; border-style: solid; }

  .lbl { position: absolute; white-space: nowrap; pointer-events: none; color: #dfe7ff;
    font-size: calc(12px * var(--inv)); text-shadow: 0 0 3px #000, 0 0 6px #000;
    transform: translate(calc(var(--off) * 1px * var(--inv)), -50%); }
  .lbl.main { color: var(--gold); font-weight: 600; font-size: calc(14px * var(--inv)); }
  .lbl.dso { color: #d6c8ff; }
  body.labels-dso .lbl.star { display: none; }
  body.labels-off .lbl { display: none; }

  #tip { position: fixed; z-index: 20; max-width: 300px; background: var(--panel); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; box-shadow: 0 8px 28px rgba(0,0,0,.5); display: none; }
  #tip.show { display: block; }
  #tip .n { font-weight: 600; font-size: 15px; }
  #tip .t { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
  #tip .al { color: var(--muted); font-size: 12px; margin-top: 4px; }
  #tip .links { margin-top: 8px; display: flex; gap: 12px; font-size: 13px; }
  #tip .nowiki { color: var(--muted); font-size: 12px; }

  aside { width: 320px; border-left: 1px solid var(--line); background: #070a12; overflow-y: auto; padding: 18px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  aside .card { margin-bottom: 22px; }
  aside .mainname { font-size: 20px; font-weight: 600; color: var(--gold); margin: 0 0 2px; }
  aside .summary { color: #c7cfdf; font-size: 13.5px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .legend { display: grid; gap: 7px; font-size: 13px; color: #c7cfdf; }
  .legend span.sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -3px; margin-right: 8px; }
  #list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  #list li { padding: 5px 6px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  #list li:hover { background: rgba(255,255,255,.06); }
  #list li .m { color: var(--muted); font-variant-numeric: tabular-nums; }
  #toggle-aside { display: none; }

  @media (max-width: 820px) {
    aside { position: absolute; right: 0; top: 0; bottom: 0; width: min(320px, 88vw); transform: translateX(100%);
      transition: transform .2s; z-index: 8; }
    body.aside-open aside { transform: none; }
    #toggle-aside { display: inline-block; }
    .controls { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body class="labels-dso">
<header>
  <a class="back" href="../index.html">← Album</a>
  <div>
    <h1 id="title"></h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="controls">
    <label><input type="checkbox" id="showMarkers" checked> Markers</label>
    <label title="Only show objects that have a Wikipedia article"><input type="checkbox" id="wikiOnly"> Wikipedia only</label>
    <label>Labels
      <select id="labels" class="btn">
        <option value="dso" selected>Deep-sky</option><option value="all">All named</option><option value="off">Off</option>
      </select></label>
    <label title="Hide stars fainter than this magnitude">Stars to mag <input type="range" id="mag" min="4" max="12" step="0.5"><span id="magv"></span></label>
    <button class="btn" id="fit" title="Reset zoom (0)">Fit</button>
    <button class="btn" id="toggle-aside">Info</button>
  </div>
</header>
<main>
  <div id="viewport">
    <div id="stage"><img id="img" src="image.jpg" alt=""><div id="layer"></div></div>
  </div>
  <aside>
    <div class="card" id="maincard"></div>
    <div class="card"><h2>Capture</h2><dl id="meta"></dl></div>
    <div class="card"><h2>Legend</h2>
      <div class="legend">
        <div><span class="sw" style="border:2px solid var(--gold)"></span>Main object</div>
        <div><span class="sw" style="border:1.5px dashed var(--dso)"></span>Galaxy / nebula / cluster</div>
        <div><span class="sw" style="border:1.5px solid rgba(124,196,255,.95)"></span>Star with a Wikipedia article</div>
        <div><span class="sw" style="border:1.5px solid rgba(124,196,255,.5)"></span>Catalogued star</div>
      </div>
    </div>
    <div class="card"><h2>Objects in frame</h2><ul id="list"></ul></div>
  </aside>
</main>
<div id="tip"></div>

<script>
const D = /*__DATA__*/null;
const SIMBAD = "https://simbad.harvard.edu/simbad/sim-id?Ident="; // built here so a re-render updates old pages
const $ = (id) => document.getElementById(id);
const tip = $("tip");
let cur = null, hideTimer = null, pinned = false;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- header + side panel
$("title").textContent = D.title;
const m = D.meta;
const fmtDate = m.date ? new Date(m.date + (m.date.endsWith("Z") ? "" : "Z")).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";
const fmtDur = (s) => { if (!s) return "—"; const h = Math.floor(s / 3600), mi = Math.round((s % 3600) / 60); return h ? `${h}h ${mi}m` : `${mi}m`; };
$("subtitle").textContent = [fmtDate, m.telescope, m.integration && fmtDur(m.integration) + " integration"].filter(Boolean).join(" · ");
document.title = D.title;

if (D.main) {
  $("maincard").innerHTML = `<h2>Main object</h2>
    <p class="mainname">${esc(D.main.name)}</p>
    <div class="t" style="color:var(--muted);font-size:13px;margin-bottom:8px">${esc(D.main.type)}${D.main.aliases.length ? " · " + esc(D.main.aliases.slice(0, 3).join(", ")) : ""}</div>
    ${D.main.summary ? `<p class="summary">${esc(D.main.summary)}</p>` : ""}
    ${D.main.wiki ? `<a href="${esc(D.main.wiki)}" target="_blank" rel="noopener">Read on Wikipedia →</a>` : ""}`;
}
const ra = (d) => { const h = d / 15, hh = Math.floor(h), mm = Math.floor((h - hh) * 60), ss = ((h - hh) * 60 - mm) * 60; return `${hh}h ${String(mm).padStart(2, "0")}m ${ss.toFixed(0).padStart(2, "0")}s`; };
const dec = (d) => { const s = d < 0 ? "−" : "+", a = Math.abs(d), dd = Math.floor(a), mm = Math.floor((a - dd) * 60), ss = ((a - dd) * 60 - mm) * 60; return `${s}${dd}° ${String(mm).padStart(2, "0")}′ ${ss.toFixed(0).padStart(2, "0")}″`; };
const rows = [
  ["Date", fmtDate], ["Telescope", m.telescope], ["Filter", m.filter],
  ["Sub-exposure", m.exposure && `${m.exposure}s`], ["Frames stacked", m.frames],
  ["Integration", fmtDur(m.integration)], ["Focal length", m.focal && `${m.focal.toFixed(0)} mm`],
  ["Gain", m.gain], ["Sensor temp", m.temp != null && `${m.temp} °C`],
  ["Center RA", ra(m.ra)], ["Center Dec", dec(m.dec)],
  ["Field of view", `${m.fov[0]}° × ${m.fov[1]}°`], ["Pixel scale", `${m.scale}″/px`],
  ["Processed with", m.software],
];
$("meta").innerHTML = rows.filter(([, v]) => v || v === 0).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");

// ---------- markers
const layer = $("layer");
const W = D.width, H = D.height;
const els = [];
const sizeFor = (mk) => mk.main ? 34 : mk.kind === "dso" ? 26 : mk.mag == null ? 12 : Math.max(10, Math.min(24, 26 - mk.mag * 1.4));
const isNamed = (mk) => mk.wiki || /^[α-ω]/.test(mk.name) || mk.kind === "dso";
D.markers.forEach((mk, i) => {
  const el = document.createElement("div");
  el.className = `mk ${mk.kind}${mk.wiki ? " wiki" : ""}${mk.main ? " main" : ""}`;
  el.style.left = (mk.x / W * 100) + "%";
  el.style.top = (mk.y / H * 100) + "%";
  el.style.setProperty("--s", sizeFor(mk));
  el.dataset.i = i;
  layer.appendChild(el);
  let ell = null, lbl = null;
  if (mk.ellipse && !mk.main) {
    ell = document.createElement("div");
    ell.className = "ell";
    ell.style.cssText = `left:${mk.x / W * 100}%;top:${mk.y / H * 100}%;width:${mk.ellipse[0] / W * 100}%;height:${mk.ellipse[1] / H * 100}%;--a:${mk.ellipse[2]}deg`;
    layer.insertBefore(ell, layer.firstChild);
  }
  if (isNamed(mk)) {
    lbl = document.createElement("div");
    lbl.className = `lbl ${mk.main ? "main" : mk.kind}`;
    lbl.textContent = mk.name;
    lbl.style.left = (mk.x / W * 100) + "%";
    lbl.style.top = (mk.y / H * 100) + "%";
    lbl.style.setProperty("--off", sizeFor(mk) / 2 + 6 + (mk.ellipse && !mk.main ? 0 : 0));
    layer.appendChild(lbl);
  }
  els.push({ el, ell, lbl });
});

// side list: main, DSOs, then named stars, then brightest
const listed = D.markers.map((mk, i) => ({ mk, i })).filter(({ mk }) => mk.main || mk.kind === "dso" || mk.wiki || (mk.mag != null && mk.mag < 8.5));
$("list").innerHTML = listed.map(({ mk, i }) => `<li data-i="${i}"><span>${mk.wiki ? "" : ""}${esc(mk.name)}</span><span class="m">${mk.mag != null ? mk.mag.toFixed(1) : ""}</span></li>`).join("");

// ---------- magnitude filter + label mode
const magMax = Math.ceil(Math.max(...D.markers.map((mk) => mk.mag ?? 0)) * 2) / 2;
$("mag").max = Math.max(magMax, 6);
$("mag").value = $("mag").max;
function applyMag() {
  const v = +$("mag").value, wikiOnly = $("wikiOnly").checked;
  $("magv").textContent = v.toFixed(1);
  D.markers.forEach((mk, i) => {
    const hide = (mk.kind === "star" && !mk.main && mk.mag != null && mk.mag > v) || (wikiOnly && !mk.wiki);
    els[i].el.classList.toggle("faint", hide);
    if (els[i].ell) els[i].ell.style.display = hide ? "none" : "";
    if (els[i].lbl) els[i].lbl.style.visibility = hide ? "hidden" : "";
  });
  document.querySelectorAll("#list li").forEach((li) => {
    li.style.display = wikiOnly && !D.markers[+li.dataset.i].wiki ? "none" : "";
  });
}
$("mag").addEventListener("input", applyMag);
$("wikiOnly").addEventListener("change", applyMag);
applyMag();
$("showMarkers").addEventListener("change", (e) => document.body.classList.toggle("hide-markers", !e.target.checked));
$("labels").addEventListener("change", (e) => {
  document.body.classList.toggle("labels-dso", e.target.value === "dso");
  document.body.classList.toggle("labels-off", e.target.value === "off");
});
$("toggle-aside").addEventListener("click", () => document.body.classList.toggle("aside-open"));

// ---------- zoom & pan
const vp = $("viewport"), stage = $("stage");
let base = 1, zoom = 1, tx = 0, ty = 0;
function layout() {
  const r = vp.getBoundingClientRect();
  base = Math.min(r.width / W, r.height / H);
  stage.style.width = W * base + "px";
  stage.style.height = H * base + "px";
}
function apply() {
  stage.style.transform = `translate(${tx}px, ${ty}px) scale(${zoom})`;
  document.documentElement.style.setProperty("--inv", 1 / zoom);
  positionTip();
}
function fit() {
  layout();
  const r = vp.getBoundingClientRect();
  zoom = 1; tx = (r.width - W * base) / 2; ty = (r.height - H * base) / 2;
  apply();
}
function zoomAt(cx, cy, f) {
  const nz = Math.min(12, Math.max(1, zoom * f));
  tx = cx - (cx - tx) * nz / zoom; ty = cy - (cy - ty) * nz / zoom; zoom = nz;
  if (zoom === 1) return fit();
  apply();
}
vp.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)));
}, { passive: false });
const ptrs = new Map(); let drag = null, pinch = null, moved = false;
vp.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".mk")) return;
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
  if (ptrs.size === 1) drag = { x: e.clientX - tx, y: e.clientY - ty, sx: e.clientX, sy: e.clientY };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; drag = null; }
  vp.classList.add("dragging");
});
vp.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = vp.getBoundingClientRect();
    zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch.d); pinch.d = d; moved = true;
  } else if (drag && zoom > 1) {
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 3) moved = true;
    tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply();
  }
});
const up = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) { drag = null; vp.classList.remove("dragging"); if (!moved) hideTip(true); } };
vp.addEventListener("pointerup", up); vp.addEventListener("pointercancel", up);
vp.addEventListener("dblclick", (e) => { const r = vp.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, 2); });
$("fit").addEventListener("click", fit);
addEventListener("keydown", (e) => {
  if (e.target.matches("input,select")) return;
  const r = vp.getBoundingClientRect();
  if (e.key === "+" || e.key === "=") zoomAt(r.width / 2, r.height / 2, 1.4);
  if (e.key === "-") zoomAt(r.width / 2, r.height / 2, 1 / 1.4);
  if (e.key === "0") fit();
  if (e.key === "Escape") hideTip(true);
});
addEventListener("resize", fit);
$("img").complete ? fit() : $("img").addEventListener("load", fit);
fit();

// ---------- tooltip
function showTip(i, pin = false) {
  clearTimeout(hideTimer);
  if (cur != null) { els[cur].el.classList.remove("active"); els[cur].ell?.classList.remove("active"); }
  cur = i; pinned = pin;
  const mk = D.markers[i];
  els[i].el.classList.add("active"); els[i].ell?.classList.add("active");
  tip.innerHTML = `<div class="n">${esc(mk.name)}${mk.main ? ' <span style="color:var(--gold);font-size:12px">★ main</span>' : ""}</div>
    <div class="t">${esc(mk.type)}${mk.mag != null ? ` · mag ${mk.mag.toFixed(2)}` : ""}</div>
    ${mk.aliases.length ? `<div class="al">${esc(mk.aliases.join(" · "))}</div>` : ""}
    <div class="links">
      ${mk.wiki ? `<a href="${esc(mk.wiki)}" target="_blank" rel="noopener">Wikipedia →</a>` : `<span class="nowiki">No Wikipedia article</span>`}
      <a href="${esc(SIMBAD + encodeURIComponent(mk.id))}" target="_blank" rel="noopener">SIMBAD</a>
    </div>`;
  tip.classList.add("show");
  positionTip();
}
function positionTip() {
  if (cur == null || !tip.classList.contains("show")) return;
  const r = els[cur].el.getBoundingClientRect(), t = tip.getBoundingClientRect();
  let x = r.right + 10, y = r.top + r.height / 2 - t.height / 2;
  if (x + t.width > innerWidth - 8) x = r.left - t.width - 10;
  y = Math.max(8, Math.min(innerHeight - t.height - 8, y));
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = y + "px";
}
function hideTip(force) {
  if (pinned && !force) return;
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    tip.classList.remove("show");
    if (cur != null) { els[cur].el.classList.remove("active"); els[cur].ell?.classList.remove("active"); }
    cur = null; pinned = false;
  }, force ? 0 : 300);
}
layer.addEventListener("pointerover", (e) => { const mkEl = e.target.closest(".mk"); if (mkEl && !pinned) showTip(+mkEl.dataset.i); });
layer.addEventListener("pointerout", (e) => { if (e.target.closest(".mk")) hideTip(false); });
layer.addEventListener("click", (e) => { const mkEl = e.target.closest(".mk"); if (mkEl) { e.stopPropagation(); showTip(+mkEl.dataset.i, true); } });
tip.addEventListener("pointerenter", () => clearTimeout(hideTimer));
tip.addEventListener("pointerleave", () => hideTip(false));

// list → fly to object
$("list").addEventListener("click", (e) => {
  const li = e.target.closest("li"); if (!li) return;
  const i = +li.dataset.i, mk = D.markers[i], r = vp.getBoundingClientRect();
  layout();
  zoom = Math.max(zoom, mk.main ? 1.5 : 3);
  tx = r.width / 2 - mk.x * base * zoom; ty = r.height / 2 - mk.y * base * zoom;
  apply();
  document.body.classList.remove("aside-open");
  requestAnimationFrame(() => showTip(i, true));
});
</script>
</body>
</html>
